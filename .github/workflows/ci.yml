name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Format check
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      - name: Coverage
        # --ir-minimum because coverage disables the optimizer, and the generated getter
        # for the twelve-field Vault struct goes stack-too-deep without it.
        run: forge coverage --ir-minimum --no-match-coverage "(test|script)"
